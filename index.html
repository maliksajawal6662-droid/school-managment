<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<title>School Management SaaS Pro – accounts (offline demo)</title>
<style>

button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.banner{background:var(--p2);border-bottom:1px dashed var(--cyan);padding:8px 14px;font-size:13px;color:var(--mute)}

.lang{position:fixed;top:40px;inset-inline-end:14px}

</style>
</head>
