<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Management v3</title>
<style>
:root{--n:#0a1428;--n2:#17284d;--c:#22d3ee;--bg:#f1f5f9;--cd:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--ok:#059669;--er:#dc2626;color-scheme:light dark}

*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
h1{font-size:1.5rem;margin:0 0 .75rem}h2{font-size:1.05rem;margin:0 0 .6rem}.m{color:var(--m)}
aside{position:fixed;inset:0 auto 0 0;width:224px;background:var(--n);color:#fff;padding:1rem;display:flex;flex-direction:column;gap:.25rem;z-index:30;transition:transform .2s}
aside .logo{font-weight:700;margin-bottom:1rem;color:var(--c)}aside button{all:unset;cursor:pointer;padding:.55rem .75rem;border-radius:8px;color:#cbd5e1}
aside button:hover{background:var(--n2)}aside button.on{background:var(--n2);color:var(--c)}
.main{margin-left:224px}header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--b);background:var(--cd);position:sticky;top:0;z-index:20}
header .sp{flex:1}.burger{display:none}main{padding:1.25rem;max-width:1100px}
.card{background:var(--cd);border:1px solid var(--b);border-radius:12px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem;margin-bottom:1rem}.grid .card{margin:0}.big{font-size:1.6rem;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}.end{justify-content:flex-end;margin-top:1rem}
.two{display:grid;grid-template-columns:1fr 20rem;gap:1rem}.two2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.6rem}
input,select,textarea{display:block;width:100%;margin-top:.25rem;padding:.5rem .65rem;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--cd);color:var(--t)}
input[type=radio]{width:auto;margin:0}input:focus,select:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.btn{cursor:pointer;border:0;border-radius:8px;padding:.5rem .9rem;font:inherit;font-weight:600;background:var(--n2);color:#fff}
.btn:hover{filter:brightness(1.15)}.btn.g{background:transparent;color:var(--t);border:1px solid var(--b)}.btn.sm{padding:.2rem .55rem;font-size:.8rem}.btn.d{background:var(--er)}
.filters{display:grid;grid-template-columns:1fr 12rem 10rem;gap:.6rem;margin-bottom:1rem}.filters input,.filters select{margin:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:30rem}th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--b);font-size:.9rem;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;color:var(--m)}.chip{display:inline-block;background:var(--bg);border-radius:99px;padding:.1rem .7rem;margin:0 .3rem .3rem 0;font-size:.8rem}
.tag{padding:.1rem .55rem;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--bg)}.tag.paid{color:var(--ok)}.tag.unpaid,.tag.void{color:var(--er)}.tag.partial{color:#d97706}
.bar{display:grid;grid-template-columns:7rem 1fr 2rem;gap:.6rem;align-items:center;margin:.5rem 0;font-size:.9rem}.bar i{height:8px;background:var(--bg);border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;background:var(--c)}
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem}.auth form{width:100%;max-width:26rem}
dialog{border:0;border-radius:14px;padding:1.25rem;width:min(34rem,94vw);background:var(--cd);color:var(--t)}dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:.6rem 1rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.show{opacity:1}#toast.bad{background:var(--er)}#print{display:none}.vch table{min-width:0}.vch td,.vch th{border:1px solid #999;color:#000}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.tabs button{all:unset;cursor:pointer;padding:.4rem .8rem;border-radius:8px;border:1px solid var(--b);font-size:.9rem}.tabs button.on{background:var(--n2);color:#fff;border-color:var(--n2)}
.in input{display:inline-block;width:auto;margin:0 .35rem 0 0}input[type=checkbox]{width:auto;margin:0;display:inline-block}.bar2{display:grid;grid-template-columns:7rem 1fr 6.5rem;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.88rem}.bar2 i{height:8px;background:var(--bg);border-radius:8px;overflow:hidden}.bar2 b{display:block;height:100%;background:var(--c)}
.err{color:var(--er)}.tag.overdue{color:var(--er)}.tag.rev{color:var(--m);text-decoration:line-through}.note{background:var(--bg);border-radius:8px;padding:.5rem .75rem;font-size:.85rem}textarea{resize:vertical}
.rc{background:#fff;color:#000;padding:12px;max-width:190mm;margin:auto;font:14px system-ui}.rc.slip{max-width:72mm;font-size:12px}.rc table{min-width:0}.rc td,.rc th{border-bottom:1px dashed #888;padding:3px 2px;white-space:normal;color:#000;text-align:left}.rc .lg{max-height:56px}.rc h2{margin:.2rem 0;color:#000}.sig{margin-top:30px;border-top:1px solid #000;width:48%;padding-top:2px;font-size:12px}
@media(max-width:820px){aside{transform:translateX(-100%)}.open aside{transform:none}.main{margin-left:0}.burger{display:block}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.two2{grid-template-columns:1fr}}
[dir=rtl] body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}[dir=rtl] aside{inset:0 0 0 auto}[dir=rtl] .main{margin-left:0;margin-right:224px}[dir=rtl] th,[dir=rtl] td{text-align:right}[dir=rtl] .rc,[dir=rtl] #print{direction:ltr}[dir=rtl] .rc td,[dir=rtl] .rc th{text-align:left}
@media(max-width:820px){[dir=rtl] aside{transform:translateX(100%)}[dir=rtl] .open aside{transform:none}[dir=rtl] .main{margin-right:0}}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:1rem}}
</style>
</head>

const KEY="ssp_v2",OLD="ssp_v1",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString("en-CA"),pad=(n,l)=>String(n).padStart(l,"0");
const money=n=>"Rs "+Math.round(n).toLocaleString("en-PK");
const mem={};let noStore=false;
const mk=g=>({get(k){try{const v=g().getItem(k);return v!==null?v:(k in mem?mem[k]:null)}catch(e){return k in mem?mem[k]:null}},set(k,v){v=String(v);try{g().setItem(k,v);delete mem[k]}catch(e){noStore=true;mem[k]=v}},del(k){try{g().removeItem(k)}catch(e){}delete mem[k]}});
const LS=mk(()=>localStorage),SS=mk(()=>sessionStorage);
try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){noStore=true}

let IX=null;const save=()=>{IX=null;if(D)ensure();LS.set(KEY,JSON.stringify(D));return true};
if(!D){try{const o=JSON.parse(LS.get(OLD));if(o&&o.admin&&Array.isArray(o.inv)){D=migrate(o);save()}}catch(e){}}

"Add student":"طالب علم شامل کریں","Export CSV":"CSV ڈاؤن لوڈ کریں","Adm. no.":"داخلہ نمبر","Name":"نام","Guardian":"سرپرست","Edit":"ترمیم","Withdraw":"خارج کریں","Reactivate":"دوبارہ فعال کریں","Full name":"پورا نام","Gender":"جنس","Male":"مرد","Female":"عورت","Other":"دیگر","Date of birth":"تاریخ پیدائش","Guardian name":"سرپرست کا نام","Guardian phone":"سرپرست کا فون","Save":"محفوظ کریں","Cancel":"منسوخ کریں","All classes":"تمام کلاسیں","active":"فعال","withdrawn":"خارج شدہ","No students found.":"کوئی طالب علم نہیں ملا۔","Search name or admission no.":"نام یا داخلہ نمبر تلاش کریں","Confirm":"تصدیق کریں","Delete":"حذف کریں",

"Add expense":"خرچ درج کریں","Category":"زمرہ","Income (fees collected)":"آمدنی (وصول شدہ فیس)","Net":"خالص","Salaries":"تنخواہیں","Utilities":"یوٹیلیٹی بل","Rent":"کرایہ","Supplies":"سامان","Maintenance":"مرمت","Events":"تقریبات","Save expense":"خرچ محفوظ کریں","Income and expenses, last 6 months":"آمدنی اور اخراجات، آخری 6 مہینے","By category":"زمرے کے لحاظ سے","All categories":"تمام زمرے",
"Student saved.":"طالب علم محفوظ ہو گیا۔","Class added.":"کلاس شامل ہو گئی۔","Section added.":"سیکشن شامل ہو گیا۔","Marks saved.":"نمبر محفوظ ہو گئے۔","Exam created.":"امتحان بن گیا۔","Saved.":"محفوظ ہو گیا۔","Fee settings saved.":"فیس کی ترتیبات محفوظ ہو گئیں۔","Expense recorded.":"خرچ درج ہو گیا۔","Grading saved.":"گریڈنگ محفوظ ہو گئی۔"};
let LANG=LS.get("ssp_lang")==="ur"?"ur":"en";
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ur"?"rtl":"ltr"}
function xlate(root){if(LANG!=="ur"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const t=n.nodeValue.trim();if(!t)return;let u=UR[t];if(!u){const m=t.match(/^Welcome, (.*)$/);if(m)u="خوش آمدید، "+m[1]}if(!u)return;const p=n.parentNode;if(p&&p.tagName==="OPTION"&&!p.hasAttribute("value"))p.setAttribute("value",t);n.nodeValue=n.nodeValue.replace(t,u)});
 root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(e=>["placeholder","aria-label","title"].forEach(a=>{const v=e.getAttribute(a);if(v&&UR[v])e.setAttribute(a,UR[v])}))}

const warn=()=>noStore?'<p role="alert" style="background:#fef3c7;color:#78350f;padding:.6rem 1rem;margin:0">Your data is NOT being saved in this view (the browser blocks storage). Download this file and open it directly in Chrome or Edge. Use Settings &gt; Download backup to keep a copy.</p>':"";
const S={page:"dash",q:"",fc:"",fs:"active",open:0,ac:"",ad:today(),is:"",focus:""};

const cls=id=>D.classes.find(c=>c.id===id),stu=id=>D.students.find(s=>s.id===id),sname=id=>(cls(id)||{name:"-"}).name;
const opts=(l,sel)=>l.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("");
const secOpts=(cid,sel)=>'<option value="">No section</option>'+opts((cls(cid)||{secs:[]}).secs,sel);
const secName=s=>{const c=cls(s.cl),x=c&&c.secs.find(z=>z.id===s.sec);return x?" - "+esc(x.name):""};
const phoneOk=p=>!p||/^\+?\d{10,14}$/.test(p.replace(/[\s-]/g,""));
const cell=v=>{let s=v==null?"":String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csv=(h,r)=>"\ufeff"+[h,...r].map(x=>x.map(cell).join(",")).join("\r\n")+"\r\n";
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function hash(p,s){const e=new TextEncoder();if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey("raw",e.encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:e.encode(s),iterations:150000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}return"w"+[...(p+s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)}
const strong=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);

const pages={
dash(){const act=D.students.filter(s=>s.st==="active"),td=Object.values(D.att[today()]||{}),pr=td.filter(v=>v==="P").length;
 const ch=D.charges.filter(c=>!c.void),billed=ch.reduce((a,c)=>a+tot(c),0),got=ch.reduce((a,c)=>a+paidC(c),0);
 const k=(l,v)=>`<div class="card"><div class="m">${l}</div><div class="big">${v}</div></div>`;
 return `<h1>Welcome, ${esc(D.admin.name)}</h1><p class="m">${esc(D.school.name)}</p><div class="grid">${k("Active students",act.length)}${k("Classes",D.classes.length)}${k("Present today",td.length?pr+" / "+td.length:"Not marked")}${k("Fees billed",R(billed))}${k("Collected",R(got))}${k("Outstanding",R(billed-got))}</div>
 <div class="card"><h2>Students per class</h2>${D.classes.length?D.classes.map(c=>{const n=act.filter(s=>s.cl===c.id).length;return `<div class="bar"><span>${esc(c.name)}</span><i><b style="width:${act.length?n/act.length*100:0}%"></b></i><span>${n}</span></div>`}).join(""):'<p class="m">Add classes to get started.</p>'}</div>`},

 <div><div class="card"><h2>Add class</h2><form data-f="class"><label>Class name<input name="name" required maxlength="60"></label><button class="btn">Add class</button></form></div>
 ${D.classes.length?`<div class="card"><h2>Add section</h2><form data-f="section"><label>Class<select name="cid">${opts(D.classes)}</select></label><label>Section<input name="name" required maxlength="30"></label><button class="btn">Add section</button></form></div>`:""}</div></div>`},
students(){const q=S.q.toLowerCase(),L=D.students.filter(s=>s.st===S.fs&&(!S.fc||s.cl===S.fc)&&(!q||s.name.toLowerCase().includes(q)||s.adm.toLowerCase().includes(q)));

promote(v){if(v.f===v.t||!cls(v.f)||!cls(v.t))return toast("Choose two different classes.",1);const L=D.students.filter(s=>s.st==="active"&&s.cl===v.f);if(!L.length)return toast("No active students in that class.",1);
 L.forEach(s=>{(s.hist=s.hist||[]).push({d:today(),f:v.f,t:v.t});s.cl=v.t;s.sec=""});audit("students.promoted",L.length+": "+sname(v.f)+" -> "+sname(v.t));if(save()){closeDlg();render();toast(L.length+" students promoted.")}},
gen(v){if(!/^\d{4}-\d{2}$/.test(v.per))return toast("Choose a month.",1);if(v.scope==="class"&&!cls(v.cid))return toast("Choose a class.",1);if(v.scope==="one"&&!stu(v.sid))return toast("Choose a student.",1);
 S.gp={scope:v.scope,cid:v.cid,sid:v.sid,per:v.per,ay:(v.ay||D.fee.year).trim()};S.gr=null;render()},

rev(v){const p=D.pays.find(x=>x.id===v.id),w=v.why.trim();if(!p||p.status!=="recorded")return;if(!w)return toast("Enter a reason.",1);p.status="reversed";p.revAt=today();p.revWhy=w;audit("payment.reversed",p.rc+" "+R(p.amt)+" - "+w);if(save()){closeDlg();render();toast("Payment reversed. Receipt kept as void.")}},
fee(v){const s=stu(v.id);if(!s)return;let fee=null;if(v.fee.trim()){fee=toP(v.fee);if(isNaN(fee))return toast("Enter a valid fee.",1)}let dc=null;
 if(v.dt){const n=v.dt==="pct"?(/^\d{1,3}$/.test(v.dv.trim())?+v.dv:NaN):toP(v.dv);if(isNaN(n)||n<=0||(v.dt==="pct"&&n>100))return toast("Enter a valid discount value.",1);dc={t:v.dt,v:n,why:v.why.trim()}}
 s.fee=fee;s.dc=dc;audit("student.fee.updated",s.name+": fee "+(fee==null?"default":R(fee))+", discount "+(dc?(dc.t==="pct"?dc.v+"%":R(dc.v)):"none"));if(save()){closeDlg();render();toast("Saved.")}},
adj(v){const c=D.charges.find(x=>x.id===v.id),w=v.why.trim();if(!c||!w)return toast("Enter a reason.",1);const t=v.amt.trim(),neg=t[0]==="-",n=toP(neg?t.slice(1):t);if(!(n>0))return toast("Enter a valid amount.",1);const a=neg?-n:n;
 if(tot(c)+a<paidC(c))return toast("That would take the fee below what is already paid. Reverse the payment first.",1);c.adj+=a;c.adjs.push({amt:a,why:w,date:today(),by:D.admin.name});audit("fee.adjusted",cname(c)+" for "+sOf(c.sid).name+": "+R(a)+" - "+w);if(save()){closeDlg();render();toast("Adjustment saved.")}},
fsave(v){const f=D.fee,def=toP(v.def),due=+v.due,grace=+v.grace,rb=+v.remB,ra=+v.remA;if(isNaN(def))return toast("Enter a valid default fee.",1);if(!(due>=1&&due<=28))return toast("Due day must be 1 to 28.",1);
 if(!(grace>=0&&grace<=60)||!(rb>=0&&rb<=30)||!(ra>=0&&ra<=30))return toast("Check the grace and reminder days.",1);if(!/^[A-Za-z0-9-]{0,8}$/.test(v.pre))return toast("Prefix: letters, numbers or dash, up to 8.",1);if(!v.year.trim())return toast("Enter the academic year.",1);
 let lv=0;if(v.lateOn){lv=v.lateType==="pct"?(/^\d{1,3}$/.test(v.lateVal.trim())&&+v.lateVal<=100?+v.lateVal:NaN):toP(v.lateVal);if(isNaN(lv))return toast("Enter a valid late fee value.",1)}
 const cf={};for(const c of D.classes){const raw=(v["cf_"+c.id]||"").trim();if(raw){const p=toP(raw);if(isNaN(p))return toast("Invalid fee for "+c.name+".",1);cf[c.id]=p}}
 Object.assign(f,{def,year:v.year.trim(),due,pre:v.pre,lateOn:!!v.lateOn,lateType:v.lateType==="pct"?"pct":"fixed",lateVal:lv,grace,partial:!!v.partial,order:v.order==="sel"?"sel":"oldest",remB:rb,remA:ra,cls:cf});audit("settings.fees","updated");if(save()){render();toast("Fee settings saved.")}},
async setup(v){if(!strong(v.pw))return toast("Password needs 10+ characters with letters and numbers.",1);if(v.pw!==v.pw2)return toast("Passwords do not match.",1);

 if(save()){SS.set("ssp_s","1");render()}else D=null},

 if(ok){SS.del("ssp_f");SS.set("ssp_s","1");render()}else{const f=(+SS.get("ssp_f")||0)+1;SS.set("ssp_f",f);if(f>=5){SS.set("ssp_u",Date.now()+30000);SS.set("ssp_f",0)}toast("Username or password is incorrect.",1)}},

student(v){const n=v.name.trim();if(n.length<2)return toast("Enter the student's name.",1);if(!cls(v.cl))return toast("Choose a class.",1);if(!phoneOk(v.gp))return toast("Enter a valid guardian phone number.",1);
 const sec=(cls(v.cl).secs.find(s=>s.id===v.sec)||{}).id||"";let s=v.id?stu(v.id):null;
 let adm=v.adm.trim();if(adm&&D.students.some(x=>x.adm.toLowerCase()===adm.toLowerCase()&&x.id!==(s&&s.id)))return toast("That admission number is already used.",1);
 if(!s){if(!adm){do{adm="ADM-"+pad(++D.n.adm,5)}while(D.students.some(x=>x.adm===adm))}s={id:uid(),st:"active",added:today()};D.students.push(s)}
 Object.assign(s,{adm:adm||s.adm,name:n,cl:v.cl,sec,g:v.g,dob:v.dob,gn:v.gn.trim(),gp:v.gp.trim()});if(save()){closeDlg();render();toast("Student saved.")}},
att(v){const L=D.students.filter(s=>s.st==="active"&&s.cl===S.ac),r=Object.assign({},D.att[S.ad]);let n=0;L.forEach(s=>{if(v["s_"+s.id]){r[s.id]=v["s_"+s.id];n++}});if(!n)return toast("Mark at least one student.",1);D.att[S.ad]=r;if(save()){render();toast("Attendance saved for "+S.ad+".")}},
school(v){D.school.name=v.name.trim();if(save()){render();toast("Saved.")}},
async pw(v){if(await hash(v.cur,D.admin.salt)!==D.admin.hash)return toast("Current password is incorrect.",1);if(!strong(v.p1))return toast("Password needs 10+ characters with letters and numbers.",1);if(v.p1!==v.p2)return toast("Passwords do not match.",1);
 D.admin.salt=uid()+uid();D.admin.hash=await hash(v.p1,D.admin.salt);if(save())toast("Password changed.")},

const runForm=async f=>{if(!f.reportValidity())return;try{await forms[f.dataset.f](Object.fromEntries(new FormData(f)),f)}catch(err){toast("Something went wrong.",1);console.error(err)}};
/* Not relying on the "submit" event: sandboxed viewers block form submission, so buttons and Enter are handled directly. */
document.addEventListener("click",e=>{const b=e.target.closest("form[data-f] button");if(b&&b.type==="submit"&&!b.dataset.a){e.preventDefault();runForm(b.closest("form"))}});

 else if(t.id==="lg"&&t.files[0]){const f=t.files[0];if(f.size>153600)return toast("Logo must be under 150 KB.",1);const r=new FileReader();r.onload=()=>{D.fee.logo=String(r.result);save();render();toast("Logo saved.")};r.readAsDataURL(f)}
 else if(t.id==="rf"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x&&x.admin&&!x.ver&&Array.isArray(x.inv))x=migrate(x);if(!x||!x.admin||!Array.isArray(x.classes)||!Array.isArray(x.students)||!Array.isArray(x.charges)||!Array.isArray(x.pays)||!x.fee||!x.att)throw 0;ask("Replace all current data with this backup?","Replace",()=>{D=x;save();SS.del("ssp_s");render();toast("Backup restored. Sign in again.")})}catch(err){toast("That file is not a valid backup.",1)}};r.readAsText(t.files[0])}});
